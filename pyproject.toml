[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trawl-api"
dynamic = ["version"]
description = "Python eBay scraper API: sold listings, prices and item details from eBay as JSON"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "trawl" }]
keywords = [
  "ebay",
  "ebay scraper",
  "ebay api",
  "ebay sold listings",
  "ebay price data",
  "sold prices",
  "scraper",
  "trawl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
]

[project.urls]
Homepage = "https://trawl.dev"
Documentation = "https://trawl.dev/docs"
Pricing = "https://trawl.dev/pricing"
Repository = "https://github.com/trawl-inc/trawl-python"
Changelog = "https://github.com/trawl-inc/trawl-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.hatch.version]
path = "src/trawl_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trawl_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
